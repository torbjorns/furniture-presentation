<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House Contents Handover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="#" class="logo">Handover<span>.</span></a>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="search" placeholder="Search items…" aria-label="Search items" />
      </div>
      <span class="item-count" id="count" aria-live="polite"></span>
    </div>
  </header>

  <div class="page">
    <aside class="sidebar" aria-label="Filters">
      <h2>Category</h2>
      <ul class="filter-list" id="filter-list" role="list"></ul>
      <div class="sort-wrap">
        <label class="sort-label" for="sort">Order</label>
        <select id="sort" aria-label="Sort items">
          <option value="default">Featured</option>
          <option value="name-asc">Name: A–Z</option>
          <option value="category-asc">Category: A–Z</option>
        </select>
      </div>
    </aside>

    <main>
      <section class="intro" aria-label="How to use this page">
        <h1 class="intro-title">House Contents Decision List</h1>
        <p class="intro-text">For each item, choose <strong>Leave</strong> or <strong>Remove</strong> and optionally add a comment. Your selections are saved automatically in this browser.</p>
      </section>
      <div class="grid" id="grid" role="list" aria-label="House items"></div>
    </main>
  </div>

  <script>
    // ─────────────────────────────────────────
    // EMOJI PLACEHOLDERS (used when no image)
    // ─────────────────────────────────────────
    const EMOJI = {
      'Living Room': '🛋️',
      'Dining':      '🍽️',
      'Bedroom':     '🛏️',
      'Office':      '📚',
      'Lighting':    '💡',
    };

    // ─────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────
    let allItems = [];
    let activeCategory = 'All';
    let searchQuery = '';
    let sortOrder = 'default';
    const STORAGE_KEY = 'house-item-decisions-v1';
    let itemSelections = {};

    function defaultSelection() {
      return {
        decision: 'leave',
        buyerComment: ''
      };
    }

    function loadSelections() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveSelections() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(itemSelections));
    }

    function ensureSelectionsForItems(items) {
      let changed = false;

      for (const item of items) {
        const key = String(item.id);
        const existing = itemSelections[key];

        if (!existing || typeof existing !== 'object') {
          itemSelections[key] = defaultSelection();
          changed = true;
          continue;
        }

        if (existing.decision !== 'leave' && existing.decision !== 'remove') {
          existing.decision = 'leave';
          changed = true;
        }

        if (typeof existing.buyerComment !== 'string') {
          existing.buyerComment = '';
          changed = true;
        }
      }

      if (changed) saveSelections();
    }

    function setDecision(itemId, decision) {
      const key = String(itemId);
      if (!itemSelections[key]) itemSelections[key] = defaultSelection();
      itemSelections[key].decision = decision;
      saveSelections();
    }

    function setBuyerComment(itemId, comment) {
      const key = String(itemId);
      if (!itemSelections[key]) itemSelections[key] = defaultSelection();
      itemSelections[key].buyerComment = comment;
      saveSelections();
    }

    // ─────────────────────────────────────────
    // LOAD DATA
    // ─────────────────────────────────────────
    fetch('data.json')
      .then(r => r.json())
      .then(data => {
        allItems = data;
        itemSelections = loadSelections();
        ensureSelectionsForItems(allItems);
        buildFilters();
        render();
      })
      .catch(() => {
        document.getElementById('grid').innerHTML =
          '<p class="error-message">Could not load furniture data. Make sure data.json is in the same folder.</p>';
      });

    // ─────────────────────────────────────────
    // BUILD CATEGORY FILTERS
    // ─────────────────────────────────────────
    function buildFilters() {
      const cats = ['All', ...new Set(allItems.map(i => i.category))];
      const list = document.getElementById('filter-list');
      list.innerHTML = cats.map(cat => {
        const count = cat === 'All' ? allItems.length : allItems.filter(i => i.category === cat).length;
        return `<li><button class="filter-btn${cat === 'All' ? ' active' : ''}"
          data-cat="${cat}" aria-pressed="${cat === 'All'}">
          ${cat} <span class="count">${count}</span>
        </button></li>`;
      }).join('');

      list.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        list.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        activeCategory = btn.dataset.cat;
        render();
      });
    }

    // ─────────────────────────────────────────
    // FILTER + SORT
    // ─────────────────────────────────────────
    function getFiltered() {
      let items = allItems.filter(item => {
        const matchCat  = activeCategory === 'All' || item.category === activeCategory;
        const q = searchQuery.toLowerCase();
        const matchSearch = !q || item.name.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) || item.description.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      if (sortOrder === 'name-asc')   items = items.sort((a, b) => a.name.localeCompare(b.name));
      if (sortOrder === 'category-asc') items = items.sort((a, b) => {
        const byCategory = a.category.localeCompare(b.category);
        return byCategory !== 0 ? byCategory : a.name.localeCompare(b.name);
      });

      return items;
    }

    // ─────────────────────────────────────────
    // RENDER GRID
    // ─────────────────────────────────────────
    function render() {
      const items = getFiltered();
      const grid  = document.getElementById('grid');
      const count = document.getElementById('count');

      const total = allItems.length;
      count.textContent = `Showing ${items.length} of ${total}`;

      if (items.length === 0) {
        grid.innerHTML = `<div class="empty"><p>No furniture found</p><p>Try adjusting your search or filters.</p></div>`;
        return;
      }

      grid.innerHTML = items.map((item, i) => {
        const emoji = EMOJI[item.category] || '🪑';
        const selection = itemSelections[String(item.id)] || defaultSelection();
        const imgEl = item.image
          ? `<img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\\'placeholder\\'>${emoji}</span>'">`
          : `<span class="placeholder">${emoji}</span>`;

        return `
          <article class="card" role="listitem"
            data-id="${item.id}"
            aria-label="${item.name}, ${item.category}">
            <div class="card-img">
              ${imgEl}
            </div>
            <div class="card-body">
              <div class="card-category">${item.category}</div>
              <h3 class="card-name">${item.name}</h3>
              <p class="card-desc">${item.description}</p>
              <div class="decision-group" data-id="${item.id}" role="group" aria-label="Choose leave or remove for ${item.name}">
                <button type="button" class="decision-btn ${selection.decision === 'leave' ? 'active' : ''}" data-id="${item.id}" data-decision="leave" aria-pressed="${selection.decision === 'leave'}">Leave</button>
                <button type="button" class="decision-btn ${selection.decision === 'remove' ? 'active' : ''}" data-id="${item.id}" data-decision="remove" aria-pressed="${selection.decision === 'remove'}">Remove</button>
              </div>
              <label class="comment-label" for="comment-${item.id}">Buyer comment</label>
              <textarea class="comment-input" id="comment-${item.id}" data-id="${item.id}" rows="3" maxlength="400" placeholder="Optional note, e.g. condition, preferred removal date, or question"></textarea>
            </div>
          </article>`;
      }).join('');

      grid.querySelectorAll('.comment-input').forEach(input => {
        const itemId = input.dataset.id;
        input.value = itemSelections[itemId]?.buyerComment || '';

        input.addEventListener('input', e => {
          setBuyerComment(itemId, e.target.value);
        });
      });

      grid.querySelectorAll('.decision-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const itemId = btn.dataset.id;
          const decision = btn.dataset.decision;

          setDecision(itemId, decision);

          const group = btn.closest('.decision-group');
          if (!group) return;

          group.querySelectorAll('.decision-btn').forEach(groupBtn => {
            groupBtn.classList.toggle('active', groupBtn.dataset.decision === decision);
            groupBtn.setAttribute('aria-pressed', String(groupBtn.dataset.decision === decision));
          });
        });
      });
    }

    // ─────────────────────────────────────────
    // SEARCH + SORT EVENTS
    // ─────────────────────────────────────────
    document.getElementById('search').addEventListener('input', e => {
      searchQuery = e.target.value;
      render();
    });

    document.getElementById('sort').addEventListener('change', e => {
      sortOrder = e.target.value;
      render();
    });
  </script>
</body>
</html>
