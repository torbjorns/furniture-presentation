<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlevering av innbo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="#" class="logo">Overlevering<span>.</span></a>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="search" placeholder="Søk i innbo…" aria-label="Søk i innbo" />
      </div>
      <span class="item-count" id="count" aria-live="polite"></span>
    </div>
  </header>

  <div class="page">
    <aside class="sidebar" aria-label="Filtre">
      <h2>Kategori</h2>
      <ul class="filter-list" id="filter-list" role="list"></ul>
      <div class="sort-wrap">
        <label class="sort-label" for="sort">Sortering</label>
        <select id="sort" aria-label="Sorter elementer">
          <option value="default">Anbefalt</option>
          <option value="name-asc">Navn: A–Å</option>
          <option value="category-asc">Kategori: A–Å</option>
        </select>
      </div>
    </aside>

    <main>
      <section class="intro" aria-label="Slik bruker du siden">
        <h1 class="intro-title">Valgliste for innbo</h1>
        <p class="intro-text">For hvert element velger du <strong>Behold</strong> eller <strong>Fjern</strong>, og kan legge inn en kommentar. Endringer lagres automatisk.</p>
        <p class="sync-status" id="sync-status" aria-live="polite"></p>
      </section>
      <div class="grid" id="grid" role="list" aria-label="Innboelementer"></div>
    </main>
  </div>

  <script>
    // ─────────────────────────────────────────
    // EMOJI PLACEHOLDERS (used when no image)
    // ─────────────────────────────────────────
    const EMOJI = {
      'Living Room': '🛋️',
      'Dining':      '🍽️',
      'Bedroom':     '🛏️',
      'Office':      '📚',
      'Lighting':    '💡',
    };

    const CATEGORY_LABELS = {
      'Living Room': 'Stue',
      'Dining': 'Spisestue',
      'Bedroom': 'Soverom',
      'Office': 'Kontor',
      'Lighting': 'Belysning',
      'Hallway': 'Gang',
      'Decor': 'Dekor',
      'Textiles': 'Tekstiler',
      'Outdoor': 'Ute',
      'Kitchen': 'Kjøkken',
      'Storage': 'Oppbevaring',
      'Building': 'Bygg',
      'Laundry': 'Vaskerom',
      'Roofing': 'Tak'
    };

    function displayCategory(category) {
      return CATEGORY_LABELS[category] || category;
    }

    // ─────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────
    let allItems = [];
    let activeCategory = 'Alle';
    let searchQuery = '';
    let sortOrder = 'default';
    const STORAGE_KEY = 'house-item-decisions-v1';
    let itemSelections = {};
    const commentSyncTimers = {};

    const SUPABASE_URL = window.SUPABASE_URL || '';
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';
    const handoverCode = (new URLSearchParams(window.location.search).get('kode') || '').trim().toLowerCase();

    let supabaseClient = null;
    let remoteEnabled = false;

    function setSyncStatus(message, level = 'info') {
      const el = document.getElementById('sync-status');
      if (!el) return;
      el.textContent = message;
      el.className = `sync-status ${level}`;
    }

    function initRemoteSync() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !handoverCode) {
        setSyncStatus('Lagring: Kun lokalt i nettleseren. Legg til Supabase-oppsett og ?kode=... i lenken for delt lagring.', 'warn');
        return;
      }

      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        setSyncStatus('Lagring: Kun lokalt. Klarte ikke å laste Supabase-klient.', 'warn');
        return;
      }

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        global: {
          headers: {
            'x-handover-code': handoverCode
          }
        }
      });

      remoteEnabled = true;
      setSyncStatus('Lagring: Koblet til skyen. Endringer synkroniseres automatisk.', 'ok');
    }

    async function loadRemoteSelections() {
      if (!remoteEnabled || !supabaseClient) return;

      const { data, error } = await supabaseClient
        .from('handover_choices')
        .select('item_id, decision, buyer_comment');

      if (error) {
        setSyncStatus(`Lagring: Skyfeil ved lasting (${error.message}). Fortsetter lokalt.`, 'error');
        return;
      }

      for (const row of data || []) {
        const key = String(row.item_id);
        itemSelections[key] = {
          decision: row.decision === 'remove' ? 'remove' : 'leave',
          buyerComment: typeof row.buyer_comment === 'string' ? row.buyer_comment : ''
        };
      }

      saveSelections();
    }

    async function syncItemToRemote(itemId) {
      if (!remoteEnabled || !supabaseClient) return;

      const key = String(itemId);
      const selection = itemSelections[key] || defaultSelection();

      const payload = {
        handover_code: handoverCode,
        item_id: Number(itemId),
        decision: selection.decision,
        buyer_comment: selection.buyerComment,
        updated_at: new Date().toISOString()
      };

      const { error } = await supabaseClient
        .from('handover_choices')
        .upsert(payload, { onConflict: 'handover_code,item_id' });

      if (error) {
        setSyncStatus(`Lagring: Klarte ikke synkronisere (${error.message}).`, 'error');
        return;
      }

      setSyncStatus('Lagring: Synkronisert.', 'ok');
    }

    function scheduleRemoteSync(itemId, immediate = false) {
      if (!remoteEnabled) return;

      const key = String(itemId);
      if (commentSyncTimers[key]) {
        clearTimeout(commentSyncTimers[key]);
      }

      if (immediate) {
        void syncItemToRemote(itemId);
        return;
      }

      commentSyncTimers[key] = setTimeout(() => {
        void syncItemToRemote(itemId);
      }, 500);
    }

    function defaultSelection() {
      return {
        decision: 'leave',
        buyerComment: ''
      };
    }

    function loadSelections() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveSelections() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(itemSelections));
    }

    function ensureSelectionsForItems(items) {
      let changed = false;

      for (const item of items) {
        const key = String(item.id);
        const existing = itemSelections[key];

        if (!existing || typeof existing !== 'object') {
          itemSelections[key] = defaultSelection();
          changed = true;
          continue;
        }

        if (existing.decision !== 'leave' && existing.decision !== 'remove') {
          existing.decision = 'leave';
          changed = true;
        }

        if (typeof existing.buyerComment !== 'string') {
          existing.buyerComment = '';
          changed = true;
        }
      }

      if (changed) saveSelections();
    }

    function setDecision(itemId, decision) {
      const key = String(itemId);
      if (!itemSelections[key]) itemSelections[key] = defaultSelection();
      itemSelections[key].decision = decision;
      saveSelections();
      scheduleRemoteSync(itemId, true);
    }

    function setBuyerComment(itemId, comment) {
      const key = String(itemId);
      if (!itemSelections[key]) itemSelections[key] = defaultSelection();
      itemSelections[key].buyerComment = comment;
      saveSelections();
      scheduleRemoteSync(itemId, false);
    }

    // ─────────────────────────────────────────
    // LOAD DATA
    // ─────────────────────────────────────────
    initRemoteSync();

    fetch('data.json')
      .then(r => r.json())
      .then(async data => {
        allItems = data;
        itemSelections = loadSelections();
        ensureSelectionsForItems(allItems);
        await loadRemoteSelections();
        buildFilters();
        render();
      })
      .catch(() => {
        document.getElementById('grid').innerHTML =
          '<p class="error-message">Kunne ikke laste inn data. Kontroller at data.json ligger i samme mappe.</p>';
      });

    // ─────────────────────────────────────────
    // BUILD CATEGORY FILTERS
    // ─────────────────────────────────────────
    function buildFilters() {
      const cats = ['Alle', ...new Set(allItems.map(i => i.category))];
      const list = document.getElementById('filter-list');
      list.innerHTML = cats.map(cat => {
        const count = cat === 'Alle' ? allItems.length : allItems.filter(i => i.category === cat).length;
        const label = cat === 'Alle' ? cat : displayCategory(cat);
        return `<li><button class="filter-btn${cat === 'Alle' ? ' active' : ''}"
          data-cat="${cat}" aria-pressed="${cat === 'Alle'}">
          ${label} <span class="count">${count}</span>
        </button></li>`;
      }).join('');

      list.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        list.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        activeCategory = btn.dataset.cat;
        render();
      });
    }

    // ─────────────────────────────────────────
    // FILTER + SORT
    // ─────────────────────────────────────────
    function getFiltered() {
      let items = allItems.filter(item => {
        const matchCat  = activeCategory === 'Alle' || item.category === activeCategory;
        const q = searchQuery.toLowerCase();
        const matchSearch = !q || item.name.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) || item.description.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      if (sortOrder === 'name-asc')   items = items.sort((a, b) => a.name.localeCompare(b.name));
      if (sortOrder === 'category-asc') items = items.sort((a, b) => {
        const byCategory = a.category.localeCompare(b.category);
        return byCategory !== 0 ? byCategory : a.name.localeCompare(b.name);
      });

      return items;
    }

    // ─────────────────────────────────────────
    // RENDER GRID
    // ─────────────────────────────────────────
    function render() {
      const items = getFiltered();
      const grid  = document.getElementById('grid');
      const count = document.getElementById('count');

      const total = allItems.length;
      count.textContent = `Viser ${items.length} av ${total}`;

      if (items.length === 0) {
        grid.innerHTML = `<div class="empty"><p>Ingen elementer funnet</p><p>Prøv å justere søk eller filtre.</p></div>`;
        return;
      }

      grid.innerHTML = items.map(item => {
        const emoji = EMOJI[item.category] || '🪑';
        const selection = itemSelections[String(item.id)] || defaultSelection();
        const imageList = Array.isArray(item.images)
          ? item.images.filter(src => typeof src === 'string' && src.trim() !== '')
          : [];
        const primaryImage = imageList[0] || '';

        const imgEl = primaryImage
          ? `<img class="card-main-image" src="${primaryImage}" alt="${item.name}" loading="lazy">`
          : `<span class="placeholder">${emoji}</span>`;

        const thumbnailsEl = imageList.length > 1
          ? `<div class="card-thumbs" role="group" aria-label="Flere bilder for ${item.name}">
              ${imageList.map((src, index) => `
                <button type="button" class="thumb-btn ${index === 0 ? 'active' : ''}" data-image-src="${src}" aria-label="Vis bilde ${index + 1}">
                  <img src="${src}" alt="Miniatyr ${index + 1} for ${item.name}" loading="lazy">
                </button>
              `).join('')}
            </div>`
          : '';

        return `
          <article class="card" role="listitem"
            data-id="${item.id}"
            aria-label="${item.name}, ${displayCategory(item.category)}">
            <div class="card-img">
              ${imgEl}
            </div>
            ${thumbnailsEl}
            <div class="card-body">
              <div class="card-category">${displayCategory(item.category)}</div>
              <h3 class="card-name">${item.name}</h3>
              <p class="card-desc">${item.description}</p>
              <div class="decision-group" data-id="${item.id}" role="group" aria-label="Velg behold eller fjern for ${item.name}">
                <button type="button" class="decision-btn ${selection.decision === 'leave' ? 'active' : ''}" data-id="${item.id}" data-decision="leave" aria-pressed="${selection.decision === 'leave'}">Behold</button>
                <button type="button" class="decision-btn ${selection.decision === 'remove' ? 'active' : ''}" data-id="${item.id}" data-decision="remove" aria-pressed="${selection.decision === 'remove'}">Fjern</button>
              </div>
              <label class="comment-label" for="comment-${item.id}">Kommentar fra kjøper</label>
              <textarea class="comment-input" id="comment-${item.id}" data-id="${item.id}" rows="3" maxlength="400" placeholder="Valgfri kommentar, f.eks. tilstand, ønsket fjerningsdato eller spørsmål"></textarea>
            </div>
          </article>`;
      }).join('');

      grid.querySelectorAll('.comment-input').forEach(input => {
        const itemId = input.dataset.id;
        input.value = itemSelections[itemId]?.buyerComment || '';

        input.addEventListener('input', e => {
          setBuyerComment(itemId, e.target.value);
        });
      });

      grid.querySelectorAll('.thumb-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.card');
          const mainImage = card?.querySelector('.card-main-image');
          const imageSrc = btn.dataset.imageSrc;
          if (!mainImage || !imageSrc) return;

          mainImage.src = imageSrc;

          const thumbRow = btn.closest('.card-thumbs');
          if (!thumbRow) return;

          thumbRow.querySelectorAll('.thumb-btn').forEach(thumb => {
            thumb.classList.toggle('active', thumb === btn);
          });
        });
      });

      grid.querySelectorAll('.card-main-image').forEach(img => {
        img.addEventListener('error', () => {
          const parent = img.parentElement;
          if (!parent) return;
          img.remove();
          if (!parent.querySelector('.placeholder')) {
            const placeholder = document.createElement('span');
            placeholder.className = 'placeholder';
            placeholder.textContent = '🪑';
            parent.appendChild(placeholder);
          }
        });
      });

      grid.querySelectorAll('.decision-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const itemId = btn.dataset.id;
          const decision = btn.dataset.decision;

          setDecision(itemId, decision);

          const group = btn.closest('.decision-group');
          if (!group) return;

          group.querySelectorAll('.decision-btn').forEach(groupBtn => {
            groupBtn.classList.toggle('active', groupBtn.dataset.decision === decision);
            groupBtn.setAttribute('aria-pressed', String(groupBtn.dataset.decision === decision));
          });
        });
      });
    }

    // ─────────────────────────────────────────
    // SEARCH + SORT EVENTS
    // ─────────────────────────────────────────
    document.getElementById('search').addEventListener('input', e => {
      searchQuery = e.target.value;
      render();
    });

    document.getElementById('sort').addEventListener('change', e => {
      sortOrder = e.target.value;
      render();
    });
  </script>
</body>
</html>
