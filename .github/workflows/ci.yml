name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install html5validator
        run: pip install html5validator
      - name: Validate HTML
        run: html5validator --root public/ --ignore-re "CSS:"
